name: iOS Beta

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "scripts/build-ios-ipa.sh"
      - "scripts/ios-release-metadata*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ios-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  beta:
    needs: checks
    permissions:
      contents: write
    uses: ./.github/workflows/ios-package.yml
    with:
      channel: beta
