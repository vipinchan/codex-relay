name: iOS 1.5.0 UI Beta

on:
  push:
    branches:
      - feat/mobile-history-navigation-beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-1.5.0-ui-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-ipa:
    name: Build and publish 1.5.0 beta IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and check formatting
        run: pnpm lint

      - name: Test Markdown parsing
        run: pnpm test:markdown

      - name: Typecheck
        run: pnpm typecheck

      - name: Build relay test exports
        run: pnpm --filter codex-relay build

      - name: Test
        run: |
          pnpm test
          pnpm --filter @codex-relay/mobile exec vitest run \
            src/components/chat/chat-preview-models.test.ts \
            src/components/chat/model-picker-navigation.test.ts

      - name: Build beta IPA
        env:
          IOS_IPA_NAME: CodexRelay-1.5.0-beta.9.ipa
          MOBILE_RELEASE_VERSION: 1.5.0-beta.9
        run: bash scripts/build-ios-ipa.sh

      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexRelay-1.5.0-beta.9-${{ github.sha }}
          path: |
            dist/ios/CodexRelay-1.5.0-beta.9.ipa
            dist/ios/CodexRelay-1.5.0-beta.9.ipa.sha256
            dist/ios/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Prepare beta release notes
        shell: bash
        run: |
          set -euo pipefail
          commit="${GITHUB_SHA:0:7}"
          app_version="$(awk -F= '$1 == "app_version" { print $2 }' dist/ios/build-info.txt)"
          min_ios="$(awk -F= '$1 == "minimum_ios" { print $2 }' dist/ios/build-info.txt)"
          cat > /tmp/beta-release-notes.md <<EOF
          ## Codex Relay iOS 1.5.0 Beta 9

          UI/UX test build based on the upstream 1.5.0 integration and the OpenMinis-style mobile interface.

          ### Included

          - Fixes bold Markdown labels ending in CJK punctuation when followed immediately by text
          - Preserves code blocks, escaped asterisks, links, and standard CommonMark emphasis behavior

          - Keeps model, reasoning effort, speed, and runtime mode isolated per conversation
          - Workspace runtime preferences remain defaults for new conversations
          - Preserves selected models when navigating back from Advanced model options
          - New chats default to the workspace used by the most recent conversation
          - Time and project groups on conversation history can be collapsed and expanded
          - Opens local Markdown links in the workspace preview instead of the iOS URL handler
          - Improves assistant Markdown readability with GitHub-flavored tables/task lists, stronger heading hierarchy, wider body line height, and dedicated list/quote/table spacing
          - Renders assistant Markdown as one native GFM block tree so nested code blocks stay inside quotes and list items; native fenced-code highlighting replaces chat-only Shiki segmentation
          - External conversation links continue to open with the platform URL handler
          - Timeline navigation pairs an upward jump to the previous user prompt with the existing Latest jump
          - Syncs codex-relay 1.6.0 with Codex CLI/SDK 0.156.1 and GPT-6 Sol/Luna support
          - GPT-6 Astra, GPT-6 Sol, GPT-6 Luna, GPT-5.6 Sol, GPT-5.6 Terra, GPT-5.6 Luna, and GPT-5.5 picker fallback
          - Push notifications show the originating thread title and can include remaining Codex usage
          - Private sideload/TrollStore IPA packaging

          ### Build

          - App version: \`${app_version}\`
          - Mobile beta: \`1.5.0-beta.9\`
          - Minimum iOS: \`${min_ios}\`
          - Commit: \`${commit}\`

          ### Installation

          Download **CodexRelay-1.5.0-beta.9.ipa** and install it with TrollStore on a compatible device.
          EOF

      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='@codex-relay/mobile@1.5.0-beta.9'
          ipa='dist/ios/CodexRelay-1.5.0-beta.9.ipa'

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$ipa" \
              "$ipa.sha256" \
              dist/ios/build-info.txt \
              --clobber
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title 'Codex Relay iOS 1.5.0 Beta 9' \
              --notes-file /tmp/beta-release-notes.md \
              --prerelease
          else
            gh release create "$tag" \
              "$ipa" \
              "$ipa.sha256" \
              dist/ios/build-info.txt \
              --target "$GITHUB_SHA" \
              --title 'Codex Relay iOS 1.5.0 Beta 9' \
              --notes-file /tmp/beta-release-notes.md \
              --prerelease
          fi

      - name: Verify published IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='@codex-relay/mobile@1.5.0-beta.9'
          ipa='CodexRelay-1.5.0-beta.9.ipa'
          rm -rf /tmp/codex-relay-beta-check
          mkdir -p /tmp/codex-relay-beta-check
          gh release download "$tag" --pattern "$ipa" --dir /tmp/codex-relay-beta-check
          expected="$(awk '{print $1}' "dist/ios/$ipa.sha256")"
          actual="$(shasum -a 256 "/tmp/codex-relay-beta-check/$ipa" | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "Verified beta IPA SHA-256: $actual"
