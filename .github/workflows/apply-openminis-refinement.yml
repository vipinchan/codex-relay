name: Apply OpenMinis refinement

on:
  push:
    branches:
      - feat/openminis-navigation-parity
    paths:
      - ".github/workflows/apply-openminis-refinement.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/openminis-navigation-parity
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/refine-openminis-navigation.py
      - run: pnpm exec oxfmt apps/mobile/src/components/chat/ChatScreen.tsx apps/mobile/src/app/settings.tsx --write
      - name: Commit source refinement
        run: |
          rm scripts/refine-openminis-navigation.py
          rm .github/workflows/apply-openminis-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/components/chat/ChatScreen.tsx apps/mobile/src/app/settings.tsx scripts/refine-openminis-navigation.py .github/workflows/apply-openminis-refinement.yml
          git commit -m "refine(mobile): align OpenMinis navigation and settings"
          git push origin HEAD:feat/openminis-navigation-parity
