name: iOS Stable Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ios-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: "!contains(github.ref_name, '-')"
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    permissions:
      contents: write
    uses: ./.github/workflows/ios-package.yml
    with:
      channel: stable
