name: Format OpenMinis UI

on:
  push:
    branches:
      - feat/openminis-navigation-parity
    paths:
      - ".github/workflows/format-openminis-ui.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/openminis-navigation-parity
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatted source and remove helper
        run: |
          rm .github/workflows/format-openminis-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/components/chat/ConversationHistoryScreen.tsx .github/workflows/format-openminis-ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(mobile): format conversation history UI"
          git push origin HEAD:feat/openminis-navigation-parity
