name: Format OpenMinis Session UI

on:
  push:
    branches:
      - feat/openminis-session-home

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: pnpm exec oxfmt apps/mobile/src/components/chat/ConversationsHome.tsx apps/mobile/src/app/settings-home.tsx --write
      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/mobile/src/components/chat/ConversationsHome.tsx apps/mobile/src/app/settings-home.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/components/chat/ConversationsHome.tsx apps/mobile/src/app/settings-home.tsx
          git commit -m "style(mobile): format OpenMinis session UI"
          git push origin HEAD:feat/openminis-session-home
