name: TrollStore IPA

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "scripts/build-trollstore-ipa.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/trollstore-ipa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "scripts/build-trollstore-ipa.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/trollstore-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: trollstore-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          node --version
          pnpm --version
          pod --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package IPA
        run: bash scripts/build-trollstore-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexRelay-TrollStore-${{ github.sha }}
          path: |
            dist/trollstore/CodexRelay-TrollStore.ipa
            dist/trollstore/CodexRelay-TrollStore.ipa.sha256
            dist/trollstore/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="trollstore-${short_sha}"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/CodexRelay-TrollStore.ipa"
          install_url="apple-magnifier://install?url=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$asset_url")"

          cat > /tmp/trollstore-release-notes.md <<EOF
          ## Codex Relay · TrollStore build

          Built automatically from \`${GITHUB_SHA}\` on \`main\`.

          ### Install on iPhone

          1. Download **CodexRelay-TrollStore.ipa** in Safari.
          2. Open/share the IPA with **TrollStore** and tap **Install**.
          3. Or try the direct TrollStore URL below on a device with TrollStore installed:

          ${install_url}

          ### Files

          - \`CodexRelay-TrollStore.ipa\` — installable package for TrollStore
          - \`CodexRelay-TrollStore.ipa.sha256\` — SHA-256 checksum
          - \`build-info.txt\` — app/Xcode/build metadata

          This is a personal sideload build and is not an App Store-signed package.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/trollstore/CodexRelay-TrollStore.ipa \
              dist/trollstore/CodexRelay-TrollStore.ipa.sha256 \
              dist/trollstore/build-info.txt \
              --clobber
            gh release edit "$tag" \
              --title "Codex Relay TrollStore · ${short_sha}" \
              --notes-file /tmp/trollstore-release-notes.md \
              --latest
          else
            gh release create "$tag" \
              dist/trollstore/CodexRelay-TrollStore.ipa \
              dist/trollstore/CodexRelay-TrollStore.ipa.sha256 \
              dist/trollstore/build-info.txt \
              --target "$GITHUB_SHA" \
              --title "Codex Relay TrollStore · ${short_sha}" \
              --notes-file /tmp/trollstore-release-notes.md \
              --latest
          fi

      - name: Verify published Release IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="trollstore-${short_sha}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for expected_asset in CodexRelay-TrollStore.ipa CodexRelay-TrollStore.ipa.sha256 build-info.txt; do
            if ! grep -Fxq "$expected_asset" <<<"$assets"; then
              echo "::error::Release is missing $expected_asset"
              exit 1
            fi
          done

          rm -rf /tmp/trollstore-release-check
          mkdir -p /tmp/trollstore-release-check
          gh release download "$tag" \
            --pattern 'CodexRelay-TrollStore.ipa' \
            --dir /tmp/trollstore-release-check

          expected_sha="$(awk '{print $1}' dist/trollstore/CodexRelay-TrollStore.ipa.sha256)"
          published_sha="$(shasum -a 256 /tmp/trollstore-release-check/CodexRelay-TrollStore.ipa | awk '{print $1}')"
          if [[ "$published_sha" != "$expected_sha" ]]; then
            echo "::error::Published IPA checksum mismatch"
            echo "expected=$expected_sha"
            echo "published=$published_sha"
            exit 1
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=trollstore-release \
            -f description='Release IPA checksum verified' \
            -f target_url="$release_url"

          echo "Release verified: $release_url"
          echo "IPA SHA-256: $published_sha"
