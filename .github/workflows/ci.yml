name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and check formatting
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test release version policy
        run: pnpm test:release

      - name: Test Markdown parsing
        run: pnpm test:markdown

      - name: Build relay test exports
        run: pnpm --filter codex-relay build

      - name: Test server
        run: pnpm test

      - name: Test mobile
        run: pnpm --filter @codex-relay/mobile exec vitest run
