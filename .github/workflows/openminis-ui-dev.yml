name: OpenMinis UI development pass

on:
  push:
    branches:
      - feat/openminis-mobile-ui

permissions:
  contents: write

concurrency:
  group: openminis-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/openminis-mobile-ui

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply UI pass
        run: node scripts/apply-openminis-ui.mjs

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Release policy tests
        run: pnpm test:release

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit validated UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "feat(mobile): adopt OpenMinis-inspired agent UI [ui-applied]"
          git push origin HEAD:feat/openminis-mobile-ui
