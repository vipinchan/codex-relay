name: Format UI Branch

on:
  push:
    branches:
      - feat/openminis-dense-home

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/openminis-dense-home
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt apps/mobile/src/components/chat/ConversationsHome.tsx .changeset/openminis-dense-home.md --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/src/components/chat/ConversationsHome.tsx .changeset/openminis-dense-home.md
          git commit -m "style(mobile): format conversation home"
          git push origin HEAD:feat/openminis-dense-home
