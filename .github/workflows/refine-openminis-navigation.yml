name: Refine OpenMinis navigation

on:
  push:
    branches:
      - feat/openminis-navigation-parity
    paths:
      - ".github/workflows/refine-openminis-navigation.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/openminis-navigation-parity
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refine navigation and settings
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "apps/mobile/src/components/chat/ChatScreen.tsx",
              '''      leadingAction={{
                icon: usesExpandedSidebar ? (isSidebarVisible ? "sidebarHide" : "sidebarShow") : "menu",
                label: usesExpandedSidebar
                  ? isSidebarVisible
                    ? "Hide threads"
                    : "Show threads"
                  : "Open threads",
                onPress: usesExpandedSidebar ? toggleThreadSidebar : openThreadDrawer,
              }}''',
              '''      leadingAction={{
                icon: usesExpandedSidebar
                  ? isSidebarVisible
                    ? "sidebarHide"
                    : "sidebarShow"
                  : "back",
                label: usesExpandedSidebar
                  ? isSidebarVisible
                    ? "Hide conversations"
                    : "Show conversations"
                  : "Back to conversations",
                onPress: usesExpandedSidebar
                  ? toggleThreadSidebar
                  : () => {
                      hapticSelection();
                      setActiveThread(undefined);
                    },
              }}''',
          )

          replace(
              "apps/mobile/src/app/settings.tsx",
              '''          <View style={styles.titleGroup}>
            <ThemedText type="smallBold" style={styles.title}>
              Settings
            </ThemedText>
            <ThemedText type="code" themeColor="textSecondary" style={styles.subtitle}>
              Account
            </ThemedText>
          </View>''',
              '''          <View style={styles.titleGroup}>
            <ThemedText type="smallBold" style={styles.title}>
              Settings
            </ThemedText>
          </View>''',
          )
          replace(
              "apps/mobile/src/app/settings.tsx",
              '''  header: {
    alignItems: "center",
    flexDirection: "row",
    gap: 10,
    paddingBottom: 8,
    paddingHorizontal: 18,
    paddingTop: 6,
  },
  headerButton: {
    alignItems: "center",
    backgroundColor: "rgba(255, 255, 255, 0.08)",
    borderColor: "rgba(255, 255, 255, 0.1)",
    borderRadius: 20,
    borderWidth: 1,
    height: 40,
    justifyContent: "center",
    width: 40,
  },
  headerButtonPlaceholder: {
    height: 40,
    width: 40,
  },''',
              '''  header: {
    alignItems: "center",
    flexDirection: "row",
    minHeight: 58,
    paddingHorizontal: 12,
  },
  headerButton: {
    alignItems: "center",
    borderRadius: 22,
    height: 44,
    justifyContent: "center",
    width: 44,
  },
  headerButtonPlaceholder: {
    height: 44,
    width: 44,
  },''',
          )
          replace(
              "apps/mobile/src/app/settings.tsx",
              '''  title: {
    fontSize: 17,
    lineHeight: 22,
    textAlign: "center",
  },
  subtitle: {
    fontSize: 10,
    lineHeight: 14,
    opacity: 0.84,
    textAlign: "center",
  },
  content: {
    gap: Spacing.four,
    paddingBottom: Spacing.five,
    paddingHorizontal: 18,
    paddingTop: Spacing.three,
  },''',
              '''  title: {
    fontFamily: Fonts.sansSemiBold,
    fontSize: 18,
    fontWeight: "600",
    lineHeight: 23,
    textAlign: "center",
  },
  subtitle: {
    fontSize: 10,
    lineHeight: 14,
    opacity: 0.84,
    textAlign: "center",
  },
  content: {
    gap: 26,
    paddingBottom: Spacing.five,
    paddingHorizontal: 18,
    paddingTop: 12,
  },''',
          )
          replace(
              "apps/mobile/src/app/settings.tsx",
              '''  sectionLabel: {
    fontFamily: Fonts.sansMedium,
    fontSize: 11,
    lineHeight: 16,
    opacity: 0.68,
  },''',
              '''  sectionLabel: {
    fontFamily: Fonts.sansMedium,
    fontSize: 13,
    lineHeight: 18,
    opacity: 0.72,
    paddingHorizontal: 8,
  },''',
          )
          replace(
              "apps/mobile/src/app/settings.tsx",
              '''  projectLinkList: {
    backgroundColor: Colors.dark.backgroundElement,
    borderColor: "rgba(255, 255, 255, 0.09)",
    borderRadius: 8,
    borderWidth: 1,
    gap: 7,
    padding: Spacing.two,
  },''',
              '''  projectLinkList: {
    backgroundColor: Colors.dark.backgroundElement,
    borderRadius: 14,
    gap: 2,
    overflow: "hidden",
    padding: 6,
  },''',
          )
          replace(
              "apps/mobile/src/app/settings.tsx",
              '''  connectionPanel: {
    backgroundColor: Colors.dark.backgroundElement,
    borderColor: "rgba(255, 255, 255, 0.09)",
    borderRadius: 8,
    borderWidth: 1,
    gap: Spacing.two,
    padding: Spacing.three,
  },
  notificationPanel: {
    backgroundColor: Colors.dark.backgroundElement,
    borderColor: "rgba(255, 255, 255, 0.09)",
    borderRadius: 8,
    borderWidth: 1,
    overflow: "hidden",
  },''',
              '''  connectionPanel: {
    backgroundColor: Colors.dark.backgroundElement,
    borderRadius: 14,
    gap: Spacing.two,
    padding: Spacing.three,
  },
  notificationPanel: {
    backgroundColor: Colors.dark.backgroundElement,
    borderRadius: 14,
    overflow: "hidden",
  },''',
          )
      - run: pnpm format
      - run: pnpm lint && pnpm typecheck && pnpm test:release
      - name: Commit refinement and remove helper
        run: |
          rm .github/workflows/refine-openminis-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/components/chat/ChatScreen.tsx apps/mobile/src/app/settings.tsx .github/workflows/refine-openminis-navigation.yml
          git commit -m "refine(mobile): align OpenMinis navigation and settings"
          git push origin HEAD:feat/openminis-navigation-parity
